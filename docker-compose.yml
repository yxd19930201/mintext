version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - mintext-data:/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/minitext.db
      - APP_ENV=production
      - DEBUG=false
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # Uncomment to use PostgreSQL instead of SQLite
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: minitext
  #     POSTGRES_PASSWORD: minitext
  #     POSTGRES_DB: minitext
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

volumes:
  mintext-data:
